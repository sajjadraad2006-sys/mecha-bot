name: CI Quality Gate

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Format, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run automated test suite with coverage
        run: pnpm test:coverage

      - name: Build packages
        run: pnpm build

      - name: Database migration smoke test
        run: pnpm db:migrate
        env:
          DATABASE_PATH: ./data/test_ci.sqlite
