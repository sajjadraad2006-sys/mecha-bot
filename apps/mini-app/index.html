<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mecha Bot — المساعد الأكاديمي لقسم الميكاترونكس</title>
  <meta name="description" content="تطبيق تيليجرام المصغر لقسم هندسة الميكاترونكس، جامعة البصرة - جدول المحاضرات الأسبوعي، ومفردات المناهج ومخطط المتطلبات السابقة.">
  <meta name="theme-color" content="#070b14">
  
  <!-- Google Fonts: Readex Pro (Arabic) & Inter (English) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="./src/index.css">
</head>
<body>

  <div id="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-branding">
        <div class="bot-avatar-badge">⚡</div>
        <div class="header-titles">
          <h1>Mecha Bot Mini App</h1>
          <p id="student-greeting">مرحباً، طالب الميكاترونكس</p>
        </div>
      </div>
      <div class="live-clock-badge">
        <span class="live-pulse-dot"></span>
        <span id="live-clock-text">--:--</span>
      </div>
    </header>

    <!-- Main Dynamic Tab Content Area -->
    <main id="tab-content-area">
      <!-- Injected via app.ts -->
    </main>
  </div>

  <!-- Modal Detail Sheet Overlay -->
  <div id="course-modal-backdrop" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-handle-bar"></div>
      <div id="modal-course-body">
        <!-- Injected via app.ts -->
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav-bar">
    <div class="bottom-nav-inner">
      <button class="nav-tab-btn active" data-tab="timetable">
        <span class="tab-icon">📅</span>
        <span class="tab-label">الجدول الأسبوعي</span>
      </button>
      <button class="nav-tab-btn" data-tab="syllabus">
        <span class="tab-icon">📚</span>
        <span class="tab-label">المناهج والمفردات</span>
      </button>
      <button class="nav-tab-btn" data-tab="progress">
        <span class="tab-icon">📊</span>
        <span class="tab-label">لوحة الإنجاز</span>
      </button>
    </div>
  </nav>

  <!-- Application Logic -->
  <script type="module" src="/bundle.js"></script>
</body>
</html>
